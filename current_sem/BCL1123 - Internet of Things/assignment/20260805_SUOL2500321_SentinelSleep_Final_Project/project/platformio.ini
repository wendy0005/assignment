[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  blynkkk/Blynk@^1.3.2
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.15
  madhephaestus/ESP32Servo@^3.0.6
build_flags =
  -D CORE_DEBUG_LEVEL=0

